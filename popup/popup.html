<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SiteWhisper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="popup-shell">

    <!-- ── Branding header ── -->
    <div class="popup-header">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M16 11 L57 50 L16 89" stroke="#1a1a1a" stroke-width="11" stroke-linejoin="miter" stroke-linecap="round"/>
          <path d="M16 11 L57 50 L16 89" stroke="#fafaf8" stroke-width="5"  stroke-linejoin="miter" stroke-linecap="round"/>
          <path d="M57 14 A39 39 0 0 1 57 86" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round"/>
          <path d="M57 14 A39 39 0 0 1 57 86" stroke="#fafaf8" stroke-width="4.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="90" y2="50" stroke="#1a1a1a" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="90" y2="50" stroke="#fafaf8" stroke-width="3"   stroke-linecap="round"/>
          <line x1="57" y1="50" x2="80" y2="24" stroke="#1a1a1a" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="80" y2="24" stroke="#fafaf8" stroke-width="3"   stroke-linecap="round"/>
          <line x1="57" y1="50" x2="80" y2="76" stroke="#1a1a1a" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="80" y2="76" stroke="#fafaf8" stroke-width="3"   stroke-linecap="round"/>
          <line x1="57" y1="50" x2="57" y2="18" stroke="#1a1a1a" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="57" y2="18" stroke="#fafaf8" stroke-width="3"   stroke-linecap="round"/>
          <line x1="57" y1="50" x2="57" y2="82" stroke="#1a1a1a" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="57" y1="50" x2="57" y2="82" stroke="#fafaf8" stroke-width="3"   stroke-linecap="round"/>
          <circle cx="57" cy="50" r="9" fill="#fafaf8" opacity="0.9"/>
          <circle cx="57" cy="50" r="5" fill="white"/>
          <circle cx="57" cy="50" r="3" fill="#1a1a1a"/>
        </svg>
        <span class="brand-text">
          <span class="brand-name">SiteWhisper</span>
          <!-- Which page the next question will read — the panel outlives the
               tab it was opened from, so this has to be explicit. -->
          <span class="page-indicator" id="pageIndicator">
            <img class="page-favicon" id="pageFavicon" alt="" />
            <span class="page-host" id="pageHost"></span>
          </span>
        </span>
      </div>
      <div class="header-actions">
        <!-- Restricted asks before consequential page actions; unrestricted does not.
             Session-scoped — it always reverts to Restricted when the panel reopens. -->
        <button class="mode-pill" id="modeBtn" type="button" aria-pressed="false">Restricted</button>
        <!-- One tap to start over — no need to go into the menu for it -->
        <button class="header-btn new-chat-btn" id="newChatBtn" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
            <line x1="12" y1="8"  x2="12" y2="14"/>
            <line x1="9"  y1="11" x2="15" y2="11"/>
          </svg>
        </button>
        <button class="header-btn" id="settingsBtn" title="Menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="8" x2="21" y2="8"/>
            <line x1="3" y1="16" x2="21" y2="16"/>
            <circle cx="8"  cy="8"  r="2.5" fill="#fafaf8"/>
            <circle cx="16" cy="16" r="2.5" fill="#fafaf8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- ── TEMPORARY: the backend runs on Render's free tier, which spins down when
         idle, so the first request of a session can stall for ~30s with nothing to
         explain it. Visibility is pure CSS — it rides the `chat-empty` class the
         intro screen already uses, so there is no JS behind it.
         To remove once the backend moves to a real server: delete this block and the
         .cold-note rules in popup.css. Nothing else refers to it. ── -->
    <div class="cold-note">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M12 7.5V12l3 1.8"/>
      </svg>
      <span>Backend is hosted on Render — the first request may take up to 30s to wake it up.</span>
    </div>

    <!-- ── Response area (fills the panel; pushes the input to the bottom).
         The .chat-history inside is created per tab by popup.js — see the
         per-tab View model there. ── -->
    <div class="response-area" id="responseArea"></div>

    <!-- ── What this thing does: stands in for the chat while it is empty.
         A sibling of .response-area rather than a child, because that element is
         opacity:0 until the first message arrives — anything inside it would be
         invisible exactly when this needs to be read. Rows are built in popup.js,
         which is where the page context and the Composio key are known. ── -->
    <div class="intro" id="intro">
      <div class="intro-inner">
        <p class="intro-lead">Reads the page you’re on — and acts on it for you.</p>
        <div class="intro-list" id="introList"></div>
        <p class="intro-foot" id="introFoot"></p>
      </div>
    </div>

    <!-- ── First-run gate: shown instead of the chat until one LLM key exists.
         Toggled by the .needs-keys class on .popup-shell. ── -->
    <div class="setup-prompt" id="setupPrompt">
      <div class="setup-inner">
        <svg class="setup-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
        <p class="setup-title">Add an API key to start</p>
        <p class="setup-sub">SiteWhisper needs a key from Anthropic, Google, OpenAI, or Groq to read pages, answer questions, and act on them for you.</p>
        <button class="setup-btn" id="setupBtn" type="button">Add keys</button>
      </div>
    </div>

    <!-- ── Input card (docks to the bottom once chatting) ── -->
    <div class="input-area">
      <div class="input-card">
        <textarea
          id="query"
          placeholder="Ask about this page, or tell it what to do…"
          rows="1"
        ></textarea>

        <div class="input-footer">
          <!-- Provider + Model selectors -->
          <div class="selectors-row">
            <div class="sel-wrap" id="providerSelector">
              <button class="sel-btn" id="providerBtn" type="button">
                <span class="sel-inner" id="providerBtnInner">
                  <span class="sel-icon" id="providerIcon"></span>
                  <span class="sel-label" id="providerLabel">Provider</span>
                  <svg class="sel-chevron" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                </span>
              </button>
            </div>

            <span class="sel-sep">/</span>

            <div class="sel-wrap" id="modelSelector">
              <button class="sel-btn" id="modelBtn" type="button">
                <span class="sel-inner" id="modelBtnInner">
                  <span class="sel-label" id="modelLabel">Model</span>
                  <svg class="sel-chevron" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>
                </span>
              </button>
            </div>
          </div>

          <!-- Send button -->
          <button class="send-btn" id="ask" type="button" disabled>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ── Full-screen selector overlay ── -->
    <div class="overlay" id="overlay">
      <div class="overlay-header">
        <button class="overlay-back" id="overlayBack" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        </button>
        <span class="overlay-title" id="overlayTitle"></span>
        <button class="overlay-close" id="overlayClose" type="button">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="overlay-list" id="overlayList"></div>
      <!-- Pinned below the scroller — the keys screen's Save button lives here
           so it never scrolls out of reach. Empty in every other mode. -->
      <div class="overlay-footer" id="overlayFooter"></div>
    </div>

  </div>
  <script src="popup.js"></script>
</body>
</html>
